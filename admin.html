<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROCK ESPORTS — Admin</title><link rel="stylesheet" href="styles.css"></head><body class="adminBody"><div class="adminWrap"><div class="adminTop"><div><div class="brand">ROCK <span>ESPORTS</span></div><p>Private Admin Panel</p></div><button id="logout" class="btn danger hidden">Logout</button></div>
<div id="loginBox" class="panel"><h1>Admin Login</h1><p>Only the authorized ROCK ESPORTS administrator can edit the website.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login" class="btn">Login</button><div id="loginMsg" class="msg"></div></div>
<div id="editor" class="hidden"><div class="tabs"><button data-tab="general">General</button><button data-tab="management">Management</button><button data-tab="members">Members</button><button data-tab="social">Social</button></div>
<section id="tab-general" class="panel tab"><h2>Website</h2><label>Site title<input id="title"></label><label>Home description<textarea id="home"></textarea></label><label>About text<textarea id="about"></textarea></label><label>Banner image URL<input id="bannerUrl"></label><label>Footer text<input id="footer"></label><button id="saveGeneral" class="btn">Save Website</button></section>
<section id="tab-management" class="panel tab hidden"><div id="managementEditor"></div><button id="addManagement" class="btn secondary">+ Add Management</button><button id="saveManagement" class="btn">Save Management</button></section>
<section id="tab-members" class="panel tab hidden"><div id="membersEditor"></div><button id="addMember" class="btn secondary">+ Add Member</button><button id="saveMembers" class="btn">Save Members</button></section>
<section id="tab-social" class="panel tab hidden"><div id="socialEditor"></div><button id="addSocial" class="btn secondary">+ Add Social Link</button><button id="saveSocial" class="btn">Save Social Links</button></section><div id="saveMsg" class="msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
